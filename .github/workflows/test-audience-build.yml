name: Test Men & Children - Build Only

on:
  workflow_dispatch:
    inputs:
      audience:
        description: "Audience to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - men
          - children
      day:
        description: "Day number to test"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAY_NUMBER: ${{ inputs.day }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Build men Reel
        if: ${{ inputs.audience == 'men' || inputs.audience == 'both' }}
        run: python build_men.py

      - name: Build children Reel
        if: ${{ inputs.audience == 'children' || inputs.audience == 'both' }}
        run: python build_children.py

      - name: Upload men test artifact
        if: ${{ inputs.audience == 'men' || inputs.audience == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: men-day-${{ inputs.day }}-build
          path: |
            outputs/men/day_*.jpg
            outputs/men/day_*_audio.wav
            outputs/men/caption.txt
            outputs/men/publish.env
            public/men/day_*.mp4
          if-no-files-found: error

      - name: Upload children test artifact
        if: ${{ inputs.audience == 'children' || inputs.audience == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: children-day-${{ inputs.day }}-build
          path: |
            outputs/children/day_*.jpg
            outputs/children/day_*_audio.wav
            outputs/children/caption.txt
            outputs/children/publish.env
            public/children/day_*.mp4
          if-no-files-found: error
