name: Build month-one content plan

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_month1_content_plan.py'
      - 'apply_supporting_text_month1.py'
      - 'data/quotes_master_clean.csv'
      - 'data/illustration_objects.csv'
      - 'data/supporting_text_month_01.csv'
      - '.github/workflows/build-month1-content-plan.yml'

permissions:
  contents: write

jobs:
  build-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Phase 3 content plan
        run: python build_month1_content_plan.py
      - name: Apply Phase 3.5 supporting text
        run: python apply_supporting_text_month1.py
      - name: Verify content plan
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from build_month1_content_plan import TARGET
          p = Path('data/content_plan_month_01.csv')
          rows = list(csv.DictReader(p.open(newline='', encoding='utf-8')))
          assert len(rows) == TARGET, len(rows)
          assert len({r['QuoteID'] for r in rows}) == TARGET
          assert all(r['Illustration'] and r['Placement'] for r in rows)
          assert all(r['SupportingText'] for r in rows)
          assert len({r['SupportingText'] for r in rows}) == TARGET
          assert all(r['SourceType'] == 'inspired_by' and r['InspiredBy'] and r['Author'] for r in rows)
          counts = [len(r['SupportingText'].replace('—', ' ').split()) for r in rows]
          assert min(counts) >= 6 and max(counts) <= 14, (min(counts), max(counts))
          print(f'Verified {TARGET} unique book-inspired mapped posts with supporting text ({min(counts)}-{max(counts)} words)')
          PY
      - name: Commit content plan
        run: |
          if [ -z "$(git status --porcelain -- data/content_plan_month_01.csv)" ]; then
            echo 'Content plan already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add data/content_plan_month_01.csv
          git commit -m 'Build Phase 3 month-one content plan'
          git push
