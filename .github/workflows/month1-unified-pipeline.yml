name: Month 1 Unified Pipeline

on:
  schedule:
    - cron: "43 5 * * *" # 11:13 IST
  workflow_dispatch:
    inputs:
      post_number:
        description: "Month-one PostNumber (1-70)"
        required: true
        default: "1"
        type: string
      publish:
        description: "Actually publish to Instagram"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'build_month1_pipeline.py'
      - 'build_feed_preview.py'
      - 'data/content_plan_month_01.csv'
      - 'illustrations/objects/core/**'
      - '.github/workflows/month1-unified-pipeline.yml'

permissions:
  contents: write

jobs:
  build-and-optionally-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      START_DATE: "2026-09-02"
      META_API_VERSION: "v26.0"
      META_GRAPH_HOST: "https://graph.instagram.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve run mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY="$(date -u +%F)"
            START_EPOCH="$(date -u -d "$START_DATE" +%s)"
            TODAY_EPOCH="$(date -u -d "$TODAY" +%s)"
            SCHEDULED_POST=$(( (TODAY_EPOCH - START_EPOCH) / 86400 + 1 ))

            if [ "$SCHEDULED_POST" -lt 1 ]; then
              echo "Unified schedule starts on $START_DATE. This pre-start run will build only."
              echo "POST_NUMBER=1" >> "$GITHUB_ENV"
              echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
            elif [ "$SCHEDULED_POST" -gt 70 ]; then
              echo "Unified Month 1 pool is exhausted. Publishing disabled."
              echo "POST_NUMBER=70" >> "$GITHUB_ENV"
              echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
            else
              echo "Scheduled unified Post $SCHEDULED_POST: publishing enabled."
              echo "POST_NUMBER=$SCHEDULED_POST" >> "$GITHUB_ENV"
              echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "POST_NUMBER=${{ inputs.post_number }}" >> "$GITHUB_ENV"
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
              echo "Manual unified run: publishing enabled."
            else
              echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
              echo "Manual unified run: build-only."
            fi
          else
            echo "POST_NUMBER=1" >> "$GITHUB_ENV"
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
            echo "Push validation: Post 1 build-only."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Build finalized feed card
        env:
          REQUIRE_REAL_AUDIO: "false"
        run: python build_month1_pipeline.py

      - name: Load build metadata
        shell: bash
        run: cat outputs/unified/publish.env >> "$GITHUB_ENV"

      - name: Verify feed post output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os

          padded = os.environ['DAY_PADDED']
          feed = Path(f'outputs/unified/day_{padded}_feed.png')
          with Image.open(feed) as im:
              assert im.size == (1080, 1080), im.size
          print('Verified finalized 1:1 Instagram feed post')
          PY

      - name: Prevent duplicate publishing
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          if [ -f "published_logs/unified/day_${DAY_PADDED}.json" ]; then
            echo "Unified Post ${DAY_NUMBER} already has a publish log. Skipping duplicate publish."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Commit image so Instagram can fetch it publicly
        if: env.SHOULD_PUBLISH == 'true' && env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          mkdir -p public/unified
          cp "outputs/unified/day_${DAY_PADDED}_feed.png" "public/unified/day_${DAY_PADDED}_feed.png"
          git config user.name "talksnwalks-agent"
          git config user.email "actions@users.noreply.github.com"
          git add "public/unified/day_${DAY_PADDED}_feed.png"
          git commit -m "Add Unified Post ${DAY_NUMBER} feed image" || echo "Image already committed"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "MEDIA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build public image URL
        if: env.SHOULD_PUBLISH == 'true' && env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${MEDIA_COMMIT}/public/unified/day_${DAY_PADDED}_feed.png"
          echo "IMAGE_URL=$IMAGE_URL" >> "$GITHUB_ENV"

      - name: Verify image is publicly reachable
        if: env.SHOULD_PUBLISH == 'true' && env.ALREADY_PUBLISHED != 'true'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$IMAGE_URL"

      - name: Publish Instagram feed post
        if: env.SHOULD_PUBLISH == 'true' && env.ALREADY_PUBLISHED != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IMAGE_URL: ${{ env.IMAGE_URL }}
          CAPTION_FILE: outputs/unified/caption.txt
          RESULT_FILE: outputs/unified/publish_result.json
        run: python publish_instagram.py

      - name: Save publishing audit log
        if: env.SHOULD_PUBLISH == 'true' && env.ALREADY_PUBLISHED != 'true' && success()
        shell: bash
        run: |
          mkdir -p published_logs/unified
          cp outputs/unified/publish_result.json "published_logs/unified/day_${DAY_PADDED}.json"
          git add "published_logs/unified/day_${DAY_PADDED}.json"
          git commit -m "Log Unified Post ${DAY_NUMBER} Instagram publish" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: month1-unified-post-${{ env.DAY_PADDED }}
          path: |
            outputs/unified/
            public/unified/day_*_feed.png
          retention-days: 14
          if-no-files-found: error
