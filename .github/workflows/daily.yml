name: Daily Instagram Reel

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Optional day number (1-365) for testing"
        required: false
        type: string
      publish:
        description: "Actually publish to Instagram"
        required: true
        default: false
        type: boolean
  schedule:
    # GitHub cron uses UTC. Start at 07:55 IST so build/upload can finish near 08:00 IST.
    - cron: "25 2 * * *"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      START_DATE: "2026-08-21"
      DAY_NUMBER: ${{ inputs.day }}
      META_API_VERSION: "v23.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this run publishes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Build today's branded Reel
        run: python build_reel.py

      - name: Load build metadata
        shell: bash
        run: cat outputs/publish.env >> "$GITHUB_ENV"

      - name: Commit Reel so Meta can fetch it publicly
        if: env.SKIP == 'false' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          git config user.name "talksnwalks-agent"
          git config user.email "actions@users.noreply.github.com"
          git add "public/day_${DAY_PADDED}.mp4"
          git commit -m "Add Day ${DAY_NUMBER} Reel media" || echo "Media already committed"
          git push
          echo "MEDIA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build public Reel URL
        if: env.SKIP == 'false' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          VIDEO_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${MEDIA_COMMIT}/public/day_${DAY_PADDED}.mp4"
          echo "VIDEO_URL=$VIDEO_URL" >> "$GITHUB_ENV"
          echo "Meta media URL prepared."

      - name: Verify Reel is publicly reachable
        if: env.SKIP == 'false' && env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$VIDEO_URL"

      - name: Publish through Meta Instagram API
        if: env.SKIP == 'false' && env.SHOULD_PUBLISH == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          VIDEO_URL: ${{ env.VIDEO_URL }}
          CAPTION_FILE: outputs/caption.txt
        run: python publish_instagram.py

      - name: Save publishing audit log
        if: env.SKIP == 'false' && env.SHOULD_PUBLISH == 'true' && success()
        shell: bash
        run: |
          mkdir -p published_logs
          cp outputs/publish_result.json "published_logs/day_${DAY_PADDED}.json"
          git add "published_logs/day_${DAY_PADDED}.json"
          git commit -m "Log Day ${DAY_NUMBER} Instagram publish" || true
          git push

      - name: Upload build artifact
        if: env.SKIP == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: talksnwalks-day-${{ env.DAY_PADDED }}
          path: |
            outputs/
            public/day_${{ env.DAY_PADDED }}.mp4
          retention-days: 14
          if-no-files-found: warn
