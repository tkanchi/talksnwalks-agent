name: Rebuild master quote library

on:
  push:
    branches: [main]
    paths:
      - 'build_master_quotes.py'
      - 'supporting_text.py'
      - 'audit_master_quotes.py'
      - 'quote_text_quality.py'
      - 'data/supporting_text_month_01.csv'
      - 'data/library/*.csv'
      - 'data/topics.csv'
      - 'data/theme_mappings.csv'
      - '.github/workflows/rebuild-master-quotes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build unified master quote library
        run: python build_master_quotes.py

      - name: Verify master library
        run: |
          python - <<'PY'
          import csv
          import re
          from pathlib import Path

          def norm(text):
              return re.sub(r'[^a-z0-9]+', '', (text or '').casefold())

          def words(text):
              return len(re.findall(r"\b[\w’'-]+\b", text or ''))

          path = Path('data/quotes_master.csv')
          if not path.exists():
              raise SystemExit('data/quotes_master.csv was not generated')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('master quote library is empty')

          required = {
              'QuoteID','Quote','SupportingText','Audience','TopicCategory','Topic','Theme',
              'SourceType','InspiredBy','Author','AttributionNote','OriginalTheme',
              'SourceURL','SourceFile','DuplicateOf'
          }
          missing = required - set(rows[0])
          if missing:
              raise SystemExit(f'missing columns: {sorted(missing)}')

          if not all((row.get('SupportingText') or '').strip() for row in rows):
              raise SystemExit('one or more master rows are missing SupportingText')
          counts = [words(row.get('SupportingText', '')) for row in rows]
          if min(counts) < 6 or max(counts) > 14:
              raise SystemExit(f'SupportingText word counts outside 6-14: {min(counts)}-{max(counts)}')
          normalized = [norm(row.get('SupportingText', '')) for row in rows]
          if len(set(normalized)) != len(rows):
              raise SystemExit('SupportingText must be unique across the master library')

          print(f'Verified {len(rows)} master rows with unique SupportingText ({min(counts)}-{max(counts)} words)')
          PY

      # Audit in the same workflow because commits made with GITHUB_TOKEN do not
      # reliably trigger a second workflow. This keeps master and clean selector
      # inputs atomic and prevents stale SupportingText from reaching selection.
      - name: Audit rebuilt master library
        run: python audit_master_quotes.py

      - name: Verify audited selector pool
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          clean = Path('data/quotes_master_clean.csv')
          attention = Path('data/quotes_master_attention.csv')
          review = Path('data/quotes_master_review.csv')
          for path in (clean, attention, review):
              if not path.exists():
                  raise SystemExit(f'{path} was not generated')

          with clean.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('clean selector pool is empty')
          if not all((row.get('SupportingText') or '').strip() for row in rows):
              raise SystemExit('clean selector pool contains blank SupportingText')
          if not all((row.get('SourceType') or '').strip().lower() == 'inspired_by' for row in rows):
              raise SystemExit('clean selector pool contains non-book content')
          if not all((row.get('InspiredBy') or '').strip() and (row.get('Author') or '').strip() for row in rows):
              raise SystemExit('clean selector pool contains incomplete book attribution')

          print(f'Verified synchronized clean selector pool: {len(rows)} rows')
          PY

      - name: Commit generated master and audit outputs
        run: |
          paths='data/quotes_master.csv data/quotes_master_clean.csv data/quotes_master_review.csv data/quotes_master_attention.csv'
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo 'Master and audit outputs are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $paths
          git commit -m 'Build unified master and audited quote library'
          git push
