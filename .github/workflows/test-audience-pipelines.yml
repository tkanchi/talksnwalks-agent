name: Test Men and Children Pipelines

on:
  workflow_dispatch:
    inputs:
      audience:
        description: "Pipeline to test"
        required: true
        default: "men"
        type: choice
        options:
          - men
          - children
      day:
        description: "Quote day to build (1-100)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout audience test branch
        uses: actions/checkout@v4
        with:
          ref: audience-split-ready

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Validate test input
        shell: bash
        run: |
          DAY="${{ inputs.day }}"
          if ! [[ "$DAY" =~ ^[0-9]+$ ]] || [ "$DAY" -lt 1 ] || [ "$DAY" -gt 100 ]; then
            echo "Day must be a number from 1 to 100."
            exit 1
          fi

      - name: Build selected pipeline
        env:
          DAY_NUMBER: ${{ inputs.day }}
        shell: bash
        run: |
          if [ "${{ inputs.audience }}" = "men" ]; then
            python build_men.py
          else
            python build_children.py
          fi

      - name: Load build metadata
        shell: bash
        run: cat "outputs/${{ inputs.audience }}/publish.env" >> "$GITHUB_ENV"

      - name: Verify generated files
        shell: bash
        run: |
          test "$SKIP" = "false"
          test -s "$IMAGE_FILE"
          test -s "$VIDEO_FILE"
          test -s "outputs/${{ inputs.audience }}/caption.txt"
          echo "Generated illustration: $ILLUSTRATION"
          echo "Generated image: $IMAGE_FILE"
          echo "Generated video: $VIDEO_FILE"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 "$VIDEO_FILE"

      - name: Create mobile preview copy
        shell: bash
        run: |
          mkdir -p "outputs/${{ inputs.audience }}/preview"
          ffmpeg -y -i "$VIDEO_FILE" \
            -vf "scale=720:1280:flags=lanczos,format=yuv420p,setsar=1" \
            -c:v libx264 -profile:v baseline -level 3.1 -preset medium -crf 24 -r 30 \
            -c:a aac -b:a 128k -ar 48000 -movflags +faststart \
            "outputs/${{ inputs.audience }}/preview/day_${DAY_PADDED}_mobile.mp4"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: talksnwalks-${{ inputs.audience }}-day-${{ env.DAY_PADDED }}-test
          path: |
            outputs/${{ inputs.audience }}/
            public/${{ inputs.audience }}/day_${{ env.DAY_PADDED }}.mp4
          retention-days: 14
          if-no-files-found: error
