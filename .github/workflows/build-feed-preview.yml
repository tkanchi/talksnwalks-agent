name: Build 4x5 feed previews

on:
  # Paused: manual runs only. No schedule/push/pull_request triggers.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Build final single feed proof
        env:
          PREVIEW_COUNT: '1'
        run: python build_feed_preview.py
      - name: Verify preview dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('outputs/feed_preview').glob('*.png'))
          assert len(files) == 1, len(files)
          with Image.open(files[0]) as im:
              assert im.size == (1080, 1350), (files[0], im.size)
          print('Verified 1 proof at 1080x1350')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: feed-preview-final-proof
          path: outputs/feed_preview/*.png
          if-no-files-found: error
